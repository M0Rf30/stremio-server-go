name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: CGO_ENABLED=0 go build -v ./...
      - run: go test -p 1 ./...

  release:
    name: GoReleaser
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: validate
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install UPX
        run: sudo apt-get update && sudo apt-get install -y upx-ucl
      - name: Locate the Android NDK cross-compilers
        # android/arm and android/arm64 are both cgo builds: Android ships no
        # /etc/resolv.conf, so a pure-Go binary's resolver falls back to
        # 127.0.0.1:53 (nothing listens there) and every DNS lookup fails --
        # only cgo linking against bionic's real resolver works. android/arm
        # also can't build any other way: the Go toolchain refuses it without
        # external linking. See the stremio-server-android and
        # stremio-server-android-arm builds in .goreleaser.yml.
        #
        # Use the NDK preinstalled on the runner image rather than fetching
        # one: a cached third-party NDK restored with its clang binary missing
        # while the wrapper scripts survived, so the presence check passed and
        # the build only failed minutes later inside goreleaser. Hence also
        # checking the tools the wrappers actually exec, not just the wrappers.
        run: |
          bin="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          for tool in clang clang++ \
                      armv7a-linux-androideabi21-clang \
                      armv7a-linux-androideabi21-clang++ \
                      aarch64-linux-android21-clang \
                      aarch64-linux-android21-clang++; do
            test -x "$bin/$tool" || { echo "missing NDK tool: $bin/$tool"; exit 1; }
          done
          echo "ANDROID_ARM_CC=$bin/armv7a-linux-androideabi21-clang" >> "$GITHUB_ENV"
          echo "ANDROID_ARM_CXX=$bin/armv7a-linux-androideabi21-clang++" >> "$GITHUB_ENV"
          echo "ANDROID_ARM64_CC=$bin/aarch64-linux-android21-clang" >> "$GITHUB_ENV"
          echo "ANDROID_ARM64_CXX=$bin/aarch64-linux-android21-clang++" >> "$GITHUB_ENV"
      - name: Install syft (for goreleaser SBOMs)
        uses: anchore/sbom-action/download-syft@006b7ce8314066bdf1765b4500370d40fa6917a3 # v0.24.2
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-dist
          path: dist/
          retention-days: 30
