name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: CGO_ENABLED=0 go build -v ./...
      - run: go test -p 1 ./...

  release:
    name: GoReleaser
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: validate
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Install UPX
        run: sudo apt-get update && sudo apt-get install -y upx-ucl
      - name: Locate the android/arm cross-compiler
        # android/arm is the one target the Go toolchain refuses to build
        # without external linking, so it needs a real NDK clang. See the
        # stremio-server-android-arm build in .goreleaser.yml.
        #
        # Use the NDK preinstalled on the runner image rather than fetching
        # one: a cached third-party NDK restored with its clang binary missing
        # while the wrapper scripts survived, so the presence check passed and
        # the build only failed minutes later inside goreleaser. Hence also
        # checking the tools the wrappers actually exec, not just the wrappers.
        run: |
          bin="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          for tool in clang clang++ \
                      armv7a-linux-androideabi21-clang \
                      armv7a-linux-androideabi21-clang++; do
            test -x "$bin/$tool" || { echo "missing NDK tool: $bin/$tool"; exit 1; }
          done
          echo "ANDROID_ARM_CC=$bin/armv7a-linux-androideabi21-clang" >> "$GITHUB_ENV"
          echo "ANDROID_ARM_CXX=$bin/armv7a-linux-androideabi21-clang++" >> "$GITHUB_ENV"
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v7
        with:
          name: release-dist
          path: dist/
          retention-days: 30
