name: CI

on:
  push:
    branches: ["main"]
    paths-ignore: ["**/*.md", "docs/**", ".gitignore", "LICENSE"]
  pull_request:
    branches: ["main"]
    paths-ignore: ["**/*.md", "docs/**", ".gitignore", "LICENSE"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint & vet
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: |
          unformatted="$(gofmt -s -l . || true)"
          if [ -n "$unformatted" ]; then
            echo "::error::These files are not gofmt -s formatted:"; echo "$unformatted"; exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
      - name: markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          globs: "**/*.md"
        continue-on-error: true

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod verify
      - name: Build (CGO disabled)
        run: CGO_ENABLED=0 go build -v ./...
      - name: Test
        run: go test -p 1 -race ./...

  build:
    name: Cross-build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [quality]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: linux, goarch: arm, goarm: "7" }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64, ext: ".exe" }
          - { goos: windows, goarch: arm64, ext: ".exe" }
          # android/arm and android/arm64 are both cgo builds against
          # bionic's DNS resolver -- a pure-Go binary finds no
          # /etc/resolv.conf on Android and every lookup fails. android/arm
          # also can't build any other way: the Go toolchain refuses it
          # without external linking.
          - { goos: android, goarch: arm64, ldextra: "-checklinkname=0", cgo: "1", ndk: true, ndkabi: "aarch64-linux-android" }
          - { goos: android, goarch: arm, goarm: "7", ldextra: "-checklinkname=0", cgo: "1", ndk: true, ndkabi: "armv7a-linux-androideabi" }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Locate the Android NDK cross-compiler
        if: matrix.ndk
        # Uses the NDK preinstalled on the runner image; see the same step in
        # release.yml for why a fetched-and-cached NDK is not trustworthy here.
        run: |
          bin="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          for tool in clang clang++ \
                      ${{ matrix.ndkabi }}21-clang \
                      ${{ matrix.ndkabi }}21-clang++; do
            test -x "$bin/$tool" || { echo "missing NDK tool: $bin/$tool"; exit 1; }
          done
          echo "CC=$bin/${{ matrix.ndkabi }}21-clang" >> "$GITHUB_ENV"
          echo "CXX=$bin/${{ matrix.ndkabi }}21-clang++" >> "$GITHUB_ENV"
      - name: Build
        env:
          CGO_ENABLED: ${{ matrix.cgo || '0' }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
        run: |
          out="dist/stremio-server_${GOOS}_${GOARCH}${{ matrix.ext }}"
          ldflags="-s -w ${{ matrix.ldextra }} -X main.buildVersion=${GITHUB_REF_NAME} -X main.buildCommit=${GITHUB_SHA::8}"
          if [ "$CGO_ENABLED" = "1" ]; then
            ldflags="$ldflags -linkmode=external -extldflags \"-pie -lm -static-libstdc++\""
          fi
          go build -trimpath -ldflags "$ldflags" -o "$out" ./cmd/stremio-server
          ls -la "$out"
      - uses: actions/upload-artifact@v7
        with:
          name: stremio-server_${{ matrix.goos }}_${{ matrix.goarch }}
          path: dist/
          retention-days: 7

  govulncheck:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...
        continue-on-error: true
