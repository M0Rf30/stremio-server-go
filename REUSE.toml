version = 1

# Files that cannot carry an inline SPDX header (no comment syntax, or
# regenerated by tooling such as `make swagger` / `go mod tidy`).
[[annotations]]
path = ["LICENSE", "go.sum", ".containerignore", "docs/swagger.json", "docs/swagger.yaml"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 The stremio-server-go Authors"
SPDX-License-Identifier = "MIT"
